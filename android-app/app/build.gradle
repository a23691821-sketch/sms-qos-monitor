plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smsqos.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.smsqos.monitor"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "04.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Permet d'afficher BuildConfig.VERSION_NAME dans l'app (écran de statut),
    // pour vérifier à l'oeil quelle version tourne sur chaque téléphone de test.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Heartbeat périodique "l'app est vivante" : WorkManager gère la persistance
    // à travers les redémarrages/Doze bien plus proprement qu'un AlarmManager
    // fait main, au prix d'un intervalle minimum de 15 min (imposé par l'API).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
