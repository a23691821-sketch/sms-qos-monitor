<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qualité de service SMS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='4' y='4' width='112' height='112' rx='30' fill='%231E8F62'/%3E%3Cpath d='M26 64 L42 64 L50 42 L64 86 L74 64 L94 64' fill='none' stroke='%23FFFFFF' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='94' cy='64' r='8' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F6F5;
    --surface: #FFFFFF;
    --surface-2: #EDF3F0;
    --line: #DCE6E1;
    --text: #172420;
    --text-dim: #57685F;
    --text-faint: #8A9691;
    --good: #1E8F62;
    --warn: #C98A1E;
    --bad: #C43E28;
    --bad-dim: #FBE3DE;
    --shadow: 0 1px 3px rgba(23,36,32,0.06), 0 1px 2px rgba(23,36,32,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Login ---------- */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 36px 32px; width: 100%; max-width: 340px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-word .l1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-word .l2 { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-top: 1px; }
  .login-card label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 5px; }
  .login-card input {
    width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 9px 12px; font-family: inherit; font-size: 14px;
  }
  .login-card input:focus { outline: none; border-color: var(--good); }
  .login-card button {
    width: 100%; margin-top: 20px; background: var(--good); color: #fff; border: none;
    border-radius: 7px; padding: 10px 12px; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .login-card button:disabled { opacity: 0.6; cursor: default; }
  .login-error {
    margin-top: 14px; padding: 8px 12px; border-radius: 7px;
    background: var(--bad-dim); color: var(--bad); font-size: 13px; display: none;
  }
  .login-error.show { display: block; }

  /* ---------- App ---------- */
  #appScreen { display: none; max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
  .topbar .brand { margin-bottom: 0; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  select, .btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 10px; font-family: inherit; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .btn:hover { background: var(--surface-2); }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px 18px; }
  .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-value { font-size: 24px; font-weight: 700; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
  .kpi-value.warn { color: var(--warn); }
  .kpi-value.bad { color: var(--bad); }

  section { margin-bottom: 28px; }
  .section-head { margin-bottom: 12px; }
  .section-head h2 { font-size: 14px; font-weight: 600; margin: 0; color: var(--text-dim); }

  .chart-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 18px 20px; min-height: 220px;
  }
  .empty-state { color: var(--text-faint); font-size: 13px; text-align: center; padding: 30px 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  td { padding: 9px 14px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .pill.delivered { background: #E3F3EA; color: var(--good); }
  .pill.failed { background: var(--bad-dim); color: var(--bad); }
  .pill.pending, .pill.timeout { background: #FCEFD9; color: var(--warn); }
</style>
</head>
<body>

  <div id="loginScreen">
    <form class="login-card" id="loginForm">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22 100 Q13 110 6 115 Q19 111 28 102 Z" fill="#1E8F62"/>
          <rect x="4" y="4" width="112" height="104" rx="26" fill="#1E8F62"/>
          <path d="M26 64 L42 64 L50 42 L64 86 L74 64 L94 64" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="94" cy="64" r="7" fill="#FFFFFF"/>
        </svg>
        <div class="brand-word">
          <div class="l1">Qualité de service SMS</div>
          <div class="l2">Espace client</div>
        </div>
      </div>

      <label for="username">Identifiant</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" id="loginBtn">Se connecter</button>
      <div class="login-error" id="loginError">Identifiants invalides.</div>
    </form>
  </div>

  <div id="appScreen">
    <div class="topbar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="4" width="112" height="112" rx="30" fill="#1E8F62"/>
          <path d="M26 64 L42 64 L50 42 L64 86 L74 64 L94 64" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="94" cy="64" r="8" fill="#FFFFFF"/>
        </svg>
        <div class="brand-word">
          <div class="l1" id="clientNameLabel">—</div>
          <div class="l2">Qualité de service SMS</div>
        </div>
      </div>
      <div class="topbar-actions">
        <select id="periodSelect">
          <option value="1">Dernière heure</option>
          <option value="6">6 dernières heures</option>
          <option value="24" selected>24 dernières heures</option>
        </select>
        <button class="btn" id="logoutBtn">Se déconnecter</button>
      </div>
    </div>

    <div class="kpi-row" id="kpiRow"></div>

    <section>
      <div class="section-head"><h2>Taux de délivrance par opérateur</h2></div>
      <div class="chart-card" id="deliveryChart"></div>
    </section>

    <section>
      <div class="section-head"><h2>Latence moyenne (envoi → réception) — en secondes</h2></div>
      <div class="chart-card" id="latencyChart"></div>
    </section>

    <section>
      <div class="section-head" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h2>Historique des tests</h2>
        <div style="display:flex;gap:8px;">
          <select id="historyOperatorSelect">
            <option value="">Tous les opérateurs</option>
          </select>
          <select id="historyPeriodSelect">
            <option value="1">Dernière heure</option>
            <option value="6">6 dernières heures</option>
            <option value="24" selected>24 dernières heures</option>
          </select>
        </div>
      </div>
      <div class="table-card">
        <table>
          <thead><tr><th>Date</th><th>Opérateur</th><th>Pays</th><th>Statut</th><th>Latence</th></tr></thead>
          <tbody id="testsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

<script>
// ---------- Auth ----------
async function checkSession() {
  try {
    const res = await fetch('/api/client/me');
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
}

function showApp(me) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('clientNameLabel').textContent = me.name;
  loadAll();
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('loginError');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Connexion...';
  try {
    const res = await fetch('/api/client/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      showApp(data);
      return;
    }
    errorBox.textContent = data.error === 'identifiants invalides' ? 'Identifiant ou mot de passe incorrect.' : (data.error || 'Erreur serveur, réessaie.');
    errorBox.classList.add('show');
  } catch (err) {
    errorBox.textContent = 'Impossible de contacter le serveur.';
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/client/logout', { method: 'POST' });
  showLogin();
});

async function clientFetch(path) {
  const res = await fetch(path);
  if (res.status === 401) { showLogin(); throw new Error('session_expired'); }
  return res;
}

// ---------- Couleurs opérateur (mêmes tokens que le dashboard interne) ----------
const OPERATOR_COLOR_PALETTE = ['#5B7FBF', '#E08A3C', '#9B59B6', '#D65C5C', '#4FB3BF', '#C9A227', '#7D8C6B'];
const OPERATOR_COLOR_FIXED = { 'Bouygues': '#1E9E52' };
const operatorColorMap = new Map();
function colorForOperator(operator) {
  if (OPERATOR_COLOR_FIXED[operator]) return OPERATOR_COLOR_FIXED[operator];
  if (!operatorColorMap.has(operator)) {
    operatorColorMap.set(operator, OPERATOR_COLOR_PALETTE[operatorColorMap.size % OPERATOR_COLOR_PALETTE.length]);
  }
  return operatorColorMap.get(operator);
}

function escapeAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}
function fmtTimeShort(iso) {
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
// Juste l'heure, sans la date : la période des graphiques ne dépasse jamais
// 24h, la date n'apporte donc rien et ne fait que rallonger le label au
// point de le faire chevaucher le suivant sur les petites rangées.
function fmtHourOnly(iso) {
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

// Petits multiples horizontaux (une rangée pleine largeur par opérateur) :
// même technique que le dashboard interne — des lignes superposées sur un
// seul plan se masquent totalement entre elles dès que deux opérateurs ont
// la même valeur au même instant (très fréquent à 100% de délivrance), donc
// chaque opérateur a sa propre rangée, jamais de recouvrement possible.
function renderSmallMultiplesChart(containerId, labels, series, opts) {
  const { suffix = '', min = 0, max = null } = opts || {};
  const container = document.getElementById(containerId);
  const allKnown = series.flatMap(s => s.points.filter(v => v != null));
  if (!allKnown.length) {
    container.innerHTML = `<div class="empty-state">Pas encore de données sur cette période.</div>`;
    return;
  }
  const yMin = min != null ? min : Math.min(...allKnown);
  const yMax = max != null ? max : Math.max(...allKnown);
  const yRange = yMax - yMin || 1;

  const n = labels.length;
  const rowGap = 4, labelColW = 90;
  const containerWidth = container.clientWidth || 600;
  const containerHeight = Math.max(160, series.length * 56);
  container.style.height = containerHeight + 'px';
  const rowH = (containerHeight - rowGap * (series.length - 1)) / series.length;
  const padL = 26, padR = 8, padT = 6;
  const plotW = containerWidth - labelColW - padL - padR;
  const xFor = (i) => padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const xTickEvery = Math.max(1, Math.ceil(n / 6));

  const rowsHtml = series.map((s, rowIndex) => {
    const isLast = rowIndex === series.length - 1;
    const padB = isLast ? 14 : 2;
    const plotH = rowH - padT - padB;
    const yFor = (v) => padT + plotH - ((v - yMin) / yRange) * plotH;

    let path = '', penDown = false, lastGood = null;
    s.points.forEach((v, i) => {
      if (v == null) { penDown = false; return; }
      const x = xFor(i), y = yFor(v);
      path += (!penDown ? `M ${x} ${y} ` : `L ${x} ${y} `);
      penDown = true;
      lastGood = { x, y };
    });

    const gridLines = [yMin, yMax].map(v => {
      const y = yFor(v);
      return `<line x1="${padL}" y1="${y}" x2="${padL + plotW}" y2="${y}" stroke="#26352233" stroke-width="1"/>`;
    }).join('');
    const yTicks = [yMax, yMin].map(v =>
      `<text x="${padL - 4}" y="${yFor(v) + 3}" text-anchor="end" font-size="9" font-family="IBM Plex Mono" fill="#5B6E69">${Math.round(v)}${suffix}</text>`
    ).join('');
    // Ancrage "start"/"end" sur le premier/dernier repère (au lieu de
    // "middle" partout) pour que leur texte reste dans les limites du SVG au
    // lieu de déborder à moitié hors cadre — c'était le cas du dernier label
    // ("02/10 1" tronqué) sur une rangée pleine largeur.
    const xTicks = isLast
      ? labels.map((lab, i) => (i % xTickEvery === 0 || i === n - 1) ? { lab, i } : null).filter(Boolean)
          .map(({ lab, i }) => {
            const anchor = i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle';
            return `<text x="${xFor(i)}" y="${rowH - 2}" text-anchor="${anchor}" font-size="9" font-family="IBM Plex Mono" fill="#5B6E69">${lab}</text>`;
          }).join('')
      : '';

    return `
      <div style="display:flex; align-items:center; height:${rowH}px;">
        <div style="width:${labelColW}px; flex:none; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#26352A; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          <span style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block;flex:none;"></span>${escapeAttr(s.label)}
        </div>
        <svg width="${containerWidth - labelColW}" height="${rowH}" viewBox="0 0 ${containerWidth - labelColW} ${rowH}" preserveAspectRatio="none" style="flex:none;">
          ${gridLines}
          <path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          ${lastGood ? `<circle cx="${lastGood.x}" cy="${lastGood.y}" r="3.5" fill="${s.color}" stroke="#fff" stroke-width="1"/>` : ''}
          ${yTicks}
          ${xTicks}
        </svg>
      </div>`;
  }).join('');

  container.innerHTML = `<div style="display:flex; flex-direction:column; gap:${rowGap}px;">${rowsHtml}</div>`;
}

function bucketMinutesFor(hours) {
  if (hours <= 1) return 5;
  if (hours <= 6) return 15;
  return 60;
}

// Grille de buckets COMPLETE sur toute la période (pas seulement les
// instants où un test a eu lieu) : avant ce correctif, l'axe des temps était
// construit uniquement à partir des horodatages présents dans la réponse,
// espacés par INDEX plutôt que par temps réel. Résultat : un opérateur avec
// peu de tests sur la période se retrouvait écrasé contre le bord droit du
// graphique (tous ses points compressés aux premiers index disponibles) au
// lieu de rester à sa vraie position chronologique, avec un vrai "trou" à
// gauche quand aucun test n'a encore eu lieu dans cette tranche horaire.
// Le calcul de bucket (floor sur l'epoch) est identique à celui du serveur
// (voir /api/client/stats/timeseries), donc les horodatages générés ici
// correspondent exactement aux clés "time" renvoyées par l'API.
function buildBucketGrid(hours, bucketMinutes) {
  const bucketMs = bucketMinutes * 60000;
  const now = Date.now();
  const since = now - hours * 3600 * 1000;
  const first = Math.ceil(since / bucketMs) * bucketMs;
  const last = Math.floor(now / bucketMs) * bucketMs;
  const out = [];
  for (let t = first; t <= last; t += bucketMs) out.push(new Date(t).toISOString());
  return out;
}

async function loadTimeseries(hours) {
  const bucketMinutes = bucketMinutesFor(hours);
  const res = await clientFetch(`/api/client/stats/timeseries?sinceHours=${hours}&bucketMinutes=${bucketMinutes}`);
  const rows = await res.json();

  const times = buildBucketGrid(hours, bucketMinutes);
  const labels = times.map(t => fmtHourOnly(t));
  const operators = [...new Set(rows.map(r => r.operator))].filter(op => op !== '__all__').sort();

  const byKeyAndTime = new Map();
  for (const r of rows) byKeyAndTime.set(`${r.operator}|${r.time}`, r);

  const buildSeries = (metric, transform) => operators.map(op => ({
    key: op, label: op, color: colorForOperator(op),
    points: times.map(t => {
      const row = byKeyAndTime.get(`${op}|${t}`);
      if (!row || row[metric] == null) return null;
      return transform(row[metric]);
    }),
  }));

  const deliverySeries = buildSeries('deliveryRate', v => Math.round(v * 1000) / 10);
  const latencySeries = buildSeries('avgLatencyMs', v => Math.round(v) / 1000);

  renderSmallMultiplesChart('deliveryChart', labels, deliverySeries, { suffix: '%', min: 0, max: 100 });
  renderSmallMultiplesChart('latencyChart', labels, latencySeries, { suffix: 's', min: 0 });

  // KPI globaux (ligne "__all__" du dernier bucket connu)
  const totalRows = rows.filter(r => r.operator === '__all__');
  const last = totalRows[totalRows.length - 1];
  const totalCount = totalRows.reduce((a, r) => a + r.total, 0);
  const deliveredCount = totalRows.reduce((a, r) => a + r.delivered, 0);
  const overallRate = totalCount ? Math.round((deliveredCount / totalCount) * 1000) / 10 : null;

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Taux de délivrance global</div>
      <div class="kpi-value ${overallRate == null ? '' : overallRate < 90 ? 'bad' : overallRate < 97 ? 'warn' : ''}">${overallRate == null ? '—' : overallRate + '%'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Tests sur la période</div>
      <div class="kpi-value">${totalCount}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Opérateurs suivis</div>
      <div class="kpi-value">${operators.length}</div>
    </div>`;
}

function statusLabel(status) {
  const map = { delivered: 'Délivré', failed: 'Échec', pending: 'En attente', timeout: 'Timeout' };
  return `<span class="pill ${status}">${map[status] || status}</span>`;
}

// L'historique a ses propres contrôles (période jusqu'à 30 jours, filtre
// opérateur), volontairement indépendants du sélecteur en haut de page qui,
// lui, ne va pas au-delà de 24h (ce dernier ne sert qu'aux graphiques).
async function loadTests() {
  const hours = parseInt(document.getElementById('historyPeriodSelect').value, 10);
  const operator = document.getElementById('historyOperatorSelect').value;
  const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
  const operatorParam = operator ? `&operator=${encodeURIComponent(operator)}` : '';
  const res = await clientFetch(`/api/client/tests?limit=300&since=${encodeURIComponent(since)}${operatorParam}`);
  const rows = await res.json();
  const body = document.getElementById('testsBody');
  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty-state">Aucun test sur cette période.</td></tr>`;
    return;
  }
  body.innerHTML = rows.map(r => `
    <tr>
      <td class="mono">${fmtTimeShort(r.sent_at)}</td>
      <td>${escapeAttr(r.operator || '—')}</td>
      <td>${escapeAttr(r.country || '—')}</td>
      <td>${statusLabel(r.final_status)}</td>
      <td class="mono">${r.latency_ms != null ? (Math.round(r.latency_ms / 100) / 10) + 's' : '—'}</td>
    </tr>`).join('');
}

async function populateHistoryOperatorFilter() {
  const res = await clientFetch('/api/client/scopes');
  const scopes = await res.json();
  const operators = [...new Set(scopes.map(s => s.operator))].sort();
  const sel = document.getElementById('historyOperatorSelect');
  sel.innerHTML = '<option value="">Tous les opérateurs</option>' +
    operators.map(op => `<option value="${escapeAttr(op)}">${escapeAttr(op)}</option>`).join('');
}

async function loadAll() {
  const hours = parseInt(document.getElementById('periodSelect').value, 10);
  await Promise.all([loadTimeseries(hours), loadTests()]);
}

document.getElementById('periodSelect').addEventListener('change', loadAll);
document.getElementById('historyPeriodSelect').addEventListener('change', loadTests);
document.getElementById('historyOperatorSelect').addEventListener('change', loadTests);
window.addEventListener('resize', () => { loadTimeseries(parseInt(document.getElementById('periodSelect').value, 10)); });

(async function init() {
  const me = await checkSession();
  if (me) { await populateHistoryOperatorFilter(); showApp(me); } else showLogin();
})();
</script>

</body>
</html>
