<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — SMS QoS Monitor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='4' y='4' width='112' height='112' rx='30' fill='%231E8F62'/%3E%3Cpath d='M26 64 L42 64 L50 42 L64 86 L74 64 L94 64' fill='none' stroke='%23FFFFFF' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='94' cy='64' r='8' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F6F5;
    --surface: #FFFFFF;
    --surface-2: #EDF3F0;
    --line: #DCE6E1;
    --text: #172420;
    --text-dim: #57685F;
    --good: #1E8F62;
    --bad: #C43E28;
    --bad-dim: #FBE3DE;
    --shadow: 0 1px 3px rgba(23,36,32,0.06), 0 1px 2px rgba(23,36,32,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 36px 32px; width: 100%; max-width: 340px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand-word .l1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .brand-word .l2 { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-top: 1px; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 5px; }
  input {
    width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 9px 12px; font-family: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--good); }

  button {
    width: 100%; margin-top: 20px; background: var(--good); color: #fff; border: none;
    border-radius: 7px; padding: 10px 12px; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.6; cursor: default; }

  .error {
    margin-top: 14px; padding: 8px 12px; border-radius: 7px;
    background: var(--bad-dim); color: var(--bad); font-size: 13px; display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>

  <form class="card" id="loginForm">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22 100 Q13 110 6 115 Q19 111 28 102 Z" fill="#1E8F62"/>
        <rect x="4" y="4" width="112" height="104" rx="26" fill="#1E8F62"/>
        <path d="M26 64 L42 64 L50 42 L64 86 L74 64 L94 64" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="94" cy="64" r="7" fill="#FFFFFF"/>
      </svg>
      <div class="brand-word">
        <div class="l1">SMS QoS</div>
        <div class="l2">Monitor</div>
      </div>
    </div>

    <label for="username">Identifiant</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus />

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit" id="submitBtn">Se connecter</button>

    <div class="error" id="errorBox">Identifiants invalides.</div>
  </form>

<script>
const params = new URLSearchParams(location.search);
const redirectTo = params.get('redirect') || '/dashboard.html';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Connexion...';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    if (res.ok) {
      window.location.href = redirectTo;
      return;
    }
    errorBox.textContent = res.status === 401 ? 'Identifiant ou mot de passe incorrect.' : 'Erreur serveur, réessaie.';
    errorBox.classList.add('show');
  } catch (err) {
    errorBox.textContent = 'Impossible de contacter le serveur.';
    errorBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});
</script>

</body>
</html>
